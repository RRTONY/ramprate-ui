[build]
  command = "yarn build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "**/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Best-effort bump for the synchronous function timeout (default 10s). The
# admin chat agent's tool loop (multi-step reads/writes via GitHub's API +
# Anthropic calls) can run long on complex edits, and 10s isn't enough.
# NOTE: on paid plans the true cap is 26s, but per Netlify support threads
# this config alone doesn't always activate it - Netlify sometimes has to
# enable the extended timeout on the account/site. If admin chat requests
# still fail on complex edits after this deploys, that's the next thing to
# check with Netlify support, not another code change.
[functions]
  timeout = 26

# CSP is deliberately not set here: the app loads inline analytics-init scripts
# (GA/Plausible in src/app/layout.tsx) that a correct CSP would need nonces or
# hashes for, and getting that wrong breaks the whole site rather than just
# SEO - needs its own careful pass, not bundled into a headers cleanup.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
