<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" role="img" aria-labelledby="title desc"><title id="title">The proposed billion-dollar community ownership structure</title><desc id="desc">A project company owns the data center. Investors fund 900 million dollars and a sponsor funds 100 million dollars for a community entity. Digital records track 90 percent investor and 10 percent community ownership. Audited distributions flow to both owners. Communities direct their own benefits.</desc><rect width="720" height="740" fill="#f7f2f9"/><g fill="#452e50" font-family="Arial,sans-serif"><text x="40" y="48" font-size="13" letter-spacing="2">ILLUSTRATIVE DESIGN · ALL-EQUITY PROJECT</text><text x="40" y="90" font-size="32">One building. A shared stake.</text><rect x="40" y="125" width="640" height="125" rx="8" fill="#e4d9ec"/><text x="65" y="161" font-size="14">PROJECT COMPANY OWNS AND OPERATES THE ASSET</text><text x="65" y="204" font-size="34">$1,000,000,000</text><text x="65" y="231" font-size="14">10 million equity units · 1 million community units tokenized</text><path d="M360 250V280M195 280H525M195 280V310M525 280V310" fill="none" stroke="#725980" stroke-width="3"/><rect x="40" y="310" width="310" height="105" rx="8" fill="#fff" stroke="#b9adb9"/><rect x="370" y="310" width="310" height="105" rx="8" fill="#fff" stroke="#725980"/><text x="60" y="341" font-size="14">CAPITAL INVESTORS</text><text x="60" y="375" font-size="27">90% · $900 million</text><text x="60" y="399" font-size="13">9 million units</text><text x="390" y="341" font-size="14">COMMUNITY ENTITY</text><text x="390" y="375" font-size="27">10% · $100 million</text><text x="390" y="399" font-size="13">1,000,000 sponsor-funded units</text><path d="M195 415V445M525 415V445M195 445H525M360 445V475" fill="none" stroke="#725980" stroke-width="3"/><rect x="40" y="475" width="640" height="105" rx="8" fill="#e4d9ec"/><text x="65" y="507" font-size="14">VERIFIED RECORDS + CONTRACTUAL RIGHTS</text><text x="65" y="539" font-size="23">Ownership · votes · budgets · payments</text><text x="65" y="562" font-size="13">Tokens record rights; the agreements establish and enforce them.</text><path d="M360 580V610" stroke="#725980" stroke-width="3"/><rect x="40" y="610" width="640" height="90" rx="8" fill="#fff" stroke="#b9adb9"/><text x="65" y="642" font-size="14">COMMUNITY DECIDES HOW ITS DISTRIBUTIONS ARE USED</text><text x="65" y="674" font-size="22">Training · care · affordability · places to play</text></g></svg>